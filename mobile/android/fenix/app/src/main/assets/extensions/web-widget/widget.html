<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web Widget</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f9f9fb;
      }
      svg {
        width: 60%;
        max-width: 220px;
        height: auto;
      }
    </style>
  </head>
  <body>

      <g fill="#5b4636" stroke="#5b4636" stroke-width="2" stroke-linejoin="round">
        <polygon points="45,40 75,90 30,95" fill="#8a6d5a" />

        <circle cx="100" cy="115" r="60" fill="#8a6d5a" />
      </g>
      <circle cx="78" cy="105" r="9" fill="#2b2b2b" />
      <circle cx="122" cy="105" r="9" fill="#2b2b2b" />

      <g stroke="#5b4636" stroke-width="2" stroke-linecap="round">
        <line x1="100" y1="132" x2="100" y2="140" />
        <line x1="100" y1="140" x2="88" y2="146" />
        <line x1="100" y1="140" x2="112" y2="146" />

        <line x1="130" y1="126" x2="165" y2="126" />
        <line x1="130" y1="134" x2="165" y2="142" />
      </g>
    </svg>
  </body>
</html>
